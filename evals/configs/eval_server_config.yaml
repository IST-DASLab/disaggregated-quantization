# Example config for eval_vllm_server.py:
#   python evals/eval_vllm_server.py evals/configs/eval_server_config.yaml
#   python evals/eval_vllm_server.py evals/configs/eval_server_config.yaml --groups think
#
# Top-level keys are defaults; each entry under `groups` overrides them and
# becomes one lm-eval run (dicts such as gen_kwargs are merged key-wise).

# Passed verbatim to lm-eval's local-chat-completions backend.
model_args:
  model: Qwen/Qwen3-8B
  base_url: http://127.0.0.1:8595/v1/chat/completions
  tokenizer: Qwen/Qwen3-8B
  tokenized_requests: false
  tokenizer_backend: none
  num_concurrent: 32
  max_retries: 3
  timeout: 3600

apply_chat_template: true
log_samples: false
# limit: 100

# Merged into every chat-completions request body; unknown keys go to vLLM as-is.
gen_kwargs:
  max_gen_toks: 4096
  temperature: 0.0

groups:
  - name: think
    tasks: [minerva_math500]
    gen_kwargs:
      max_gen_toks: 16384
      temperature: 0.6
      chat_template_kwargs:
        enable_thinking: true

  - name: no-think
    tasks: [gsm8k, mmlu_cot_llama, mmlu_pro]
    gen_kwargs:
      max_gen_toks: 8192
      chat_template_kwargs:
        enable_thinking: false

output_dir: eval_results_server
run_name: qwen3-8b-bf16
